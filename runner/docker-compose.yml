services:
  github-runner:
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.337.0}
    container_name: github-runner-tao
    restart: unless-stopped
    init: true
    environment:
      REPO_URL: ${REPO_URL}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-tao-ftms-docker}
      RUNNER_LABELS: ${RUNNER_LABELS:-tao-ftms}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Temporary fallback while the host DNS servers are unreachable.
      - "api.github.com:4.228.31.149"
      - "github.com:4.228.31.150"
      - "broker.actions.githubusercontent.com:20.85.130.105"
      - "pipelinesghubeus8.actions.githubusercontent.com:20.102.39.220"
      - "tokenghub.actions.githubusercontent.com:20.85.108.33"
      - "run-actions-3-azure-eastus.actions.githubusercontent.com:20.85.130.105"
      - "run-actions-2-azure-eastus.actions.githubusercontent.com:20.85.130.105"
      - "run-actions-1-azure-eastus.actions.githubusercontent.com:20.85.130.105"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./work:/runner/_work
