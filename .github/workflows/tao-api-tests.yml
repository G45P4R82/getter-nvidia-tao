name: TAO API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run tests that create and delete a workspace
        required: false
        default: false
        type: boolean
      run_pipeline:
        description: Run real GPU training and deployment pipeline
        required: false
        default: false
        type: boolean
      run_prompt:
        description: Run Experiment 001 through OpenCode, Azure OpenAI and TAO MCP
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tao-api-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TAO_BASE_URL: ${{ vars.TAO_BASE_URL || 'http://100.107.81.126:8090' }}
  TAO_ORG: ${{ vars.TAO_ORG || 'getter' }}

jobs:
  mcp-unit:
    name: FastMCP real tests
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
      TAO_RUN_REAL_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MCP dependencies
        run: python -m pip install -e 'mcp[test]'

      - name: Run real MCP tests
        env:
          TAO_RUN_REAL_TESTS: 'true'
        run: python scripts/run_unittest_report.py --start-dir mcp/tests --experiment mcp-ci --report-dir test-reports

      - name: Upload MCP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-report
          path: test-reports/

  safe:
    name: Safe system and boundary tests
    runs-on: [self-hosted, linux, tao-ftms]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run real API tests
        env:
          TAO_RUN_REAL_TESTS: 'true'
        run: python scripts/run_unittest_report.py --start-dir tests --experiment api-ci --report-dir test-reports

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: test-reports/

  authenticated:
    name: Authenticated regression tests
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run authenticated tests
        env:
          TAO_RUN_REAL_TESTS: 'true'
        run: python scripts/run_unittest_report.py --start-dir tests --experiment auth-ci --report-dir test-reports

      - name: Upload authenticated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-test-report
          path: test-reports/

  integration:
    name: Opt-in integration lifecycle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run workspace lifecycle test
        env:
          TAO_RUN_REAL_TESTS: 'true'
          TAO_RUN_MUTATIONS: 'true'
        run: python scripts/run_unittest_report.py --start-dir tests --experiment integration-ci --report-dir test-reports

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: test-reports/

  real-pipeline:
    name: Real TAO GPU pipeline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pipeline == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
      TAO_RUN_REAL_TESTS: 'true'
      TAO_RUN_REAL_PIPELINE: 'true'
      TAO_RUN_REAL_DEPLOY: 'true'
      TAO_TEST_WORKSPACE_ID: ${{ vars.TAO_TEST_WORKSPACE_ID }}
      TAO_TRAIN_DATASET_URI: ${{ vars.TAO_TRAIN_DATASET_URI }}
      TAO_TRAIN_SPECS_JSON: ${{ secrets.TAO_TRAIN_SPECS_JSON }}
      TAO_EVAL_SPECS_JSON: ${{ secrets.TAO_EVAL_SPECS_JSON }}
      TAO_EXPORT_SPECS_JSON: ${{ secrets.TAO_EXPORT_SPECS_JSON }}
      TAO_TRT_SPECS_JSON: ${{ secrets.TAO_TRT_SPECS_JSON }}
      TAO_INFERENCE_SPECS_JSON: ${{ secrets.TAO_INFERENCE_SPECS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run real training pipeline
        run: python scripts/run_unittest_report.py --start-dir tests --pattern 'test_real_pipeline_unittest.py' --experiment pipeline-ci --report-dir test-reports

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-report
          path: test-reports/

  prompt-e2e:
    name: Experiment 001 OpenCode prompt E2E
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_prompt == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_AUTH_MODE: azure_ad
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
      TAO_BASE_URL: ${{ vars.TAO_BASE_URL || 'http://host.docker.internal:8090' }}
      TAO_ORG: ${{ vars.TAO_ORG || 'getter' }}
      TAO_TEST_WORKSPACE_ID: ${{ vars.TAO_TEST_WORKSPACE_ID }}
      TAO_TRAIN_DATASET_URI: ${{ vars.TAO_TRAIN_DATASET_URI }}
      TAO_EVAL_DATASET_URI: ${{ vars.TAO_EVAL_DATASET_URI }}
      TAO_INFERENCE_DATASET_URI: ${{ vars.TAO_INFERENCE_DATASET_URI }}
      TAO_BASE_EXPERIMENT_IDS: ${{ vars.TAO_BASE_EXPERIMENT_IDS }}
      TAO_REAL_NETWORK: ${{ vars.TAO_REAL_NETWORK || 'classification_pyt' }}
      TAO_MCP_ALLOW_MUTATIONS: 'true'
      TAO_RUN_REAL_TESTS: 'true'
      TAO_RUN_REAL_PIPELINE: 'true'
      TAO_RUN_REAL_DEPLOY: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MCP environment
        run: |
          python -m venv mcp/.venv
          mcp/.venv/bin/pip install -e 'mcp[test]'

      - name: Install Azure identity dependency
        run: python -m pip install azure-identity

      - name: Acquire Azure AI bearer token
        run: |
          TOKEN=$(python scripts/get_azure_token.py)
          echo "::add-mask::$TOKEN"
          echo "OPENAI_API_KEY=$TOKEN" >> "$GITHUB_ENV"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version

      - name: Create CI OpenCode config
        env:
          OPENCODE_CONFIG_OUTPUT: ${{ runner.temp }}/opencode-ci.json
        run: |
          python scripts/create_opencode_ci_config.py
          echo "OPENCODE_CONFIG=${{ runner.temp }}/opencode-ci.json" >> "$GITHUB_ENV"

      - name: Verify OpenCode MCP connection
        run: opencode mcp list

      - name: Run Experiment 001 prompt
        run: |
          python scripts/run_opencode_prompt_report.py \
            --prompt-file tests/prompts/experiment_001_full_pipeline.txt \
            --experiment 001-prompt-e2e \
            --report-dir test-reports \
            --artifact-dir test-reports/experiment_001-prompt-e2e

      - name: Package prompt report
        if: always()
        run: tar -czf "experiment_001-prompt-${GITHUB_RUN_ID}.tar.gz" -C test-reports experiment_001-prompt-e2e

      - name: Upload prompt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-prompt-report
          path: |
            test-reports/
            experiment_001-prompt-*.tar.gz

  publish-prompt-release:
    name: Publish Experiment 001 Release
    needs: prompt-e2e
    if: ${{ needs.prompt-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download prompt report
        uses: actions/download-artifact@v4
        with:
          name: experiment-001-prompt-report
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experiment-001-prompt-${{ github.run_number }}
          name: Experiment 001 Prompt ${{ github.run_number }}
          generate_release_notes: false
          body: |
            Real OpenCode -> Azure OpenAI -> TAO MCP -> TAO FTMS experiment.
            Report and raw OpenCode/MCP events are attached as release assets.
          files: release-assets/experiment_001-prompt-*.tar.gz
