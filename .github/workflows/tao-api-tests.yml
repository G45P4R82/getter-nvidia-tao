name: TAO API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run tests that create and delete a workspace
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tao-api-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TAO_BASE_URL: ${{ vars.TAO_BASE_URL || 'http://100.107.81.126:8090' }}
  TAO_ORG: ${{ vars.TAO_ORG || 'getter' }}

jobs:
  safe:
    name: Safe system and boundary tests
    runs-on: [self-hosted, linux, tao-ftms]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run safe tests
        run: pytest -m 'not auth and not integration' -q

  authenticated:
    name: Authenticated regression tests
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run authenticated tests
        run: pytest --run-auth -m 'auth and not integration' -q

  integration:
    name: Opt-in integration lifecycle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run workspace lifecycle test
        run: pytest --run-auth --run-integration -m integration -q
