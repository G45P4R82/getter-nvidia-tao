name: TAO API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run tests that create and delete a workspace
        required: false
        default: false
        type: boolean
      run_pipeline:
        description: Run real GPU training and deployment pipeline
        required: false
        default: false
        type: boolean
      run_prompt:
        description: Run Experiment 001 through OpenCode, Azure OpenAI and TAO MCP
        required: false
        default: false
        type: boolean
      run_full_api:
        description: Run the complete direct TAO API validation job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tao-api-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  TAO_BASE_URL: ${{ vars.TAO_BASE_URL || 'http://100.107.81.126:8090' }}
  TAO_ORG: ${{ vars.TAO_ORG || 'getter' }}

jobs:
  mcp-unit:
    name: FastMCP real tests
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
      TAO_RUN_REAL_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MCP dependencies
        run: python -m pip install -e 'mcp[test]'

      - name: Run real MCP tests
        env:
          TAO_RUN_REAL_TESTS: 'true'
        run: python scripts/run_unittest_report.py --start-dir mcp/tests --experiment mcp-ci --report-dir test-reports

      - name: Upload MCP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-report
          path: test-reports/

  safe:
    name: Safe system and boundary tests
    runs-on: [self-hosted, linux, tao-ftms]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run real API tests
        env:
          TAO_RUN_REAL_TESTS: 'true'
        run: python scripts/run_unittest_report.py --start-dir tests --experiment api-ci --report-dir test-reports

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: test-reports/

  authenticated:
    name: Authenticated regression tests
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run authenticated tests
        env:
          TAO_RUN_REAL_TESTS: 'true'
        run: python scripts/run_unittest_report.py --start-dir tests --experiment auth-ci --report-dir test-reports

      - name: Upload authenticated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-test-report
          path: test-reports/

  integration:
    name: Opt-in integration lifecycle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_integration == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run workspace lifecycle test
        env:
          TAO_RUN_REAL_TESTS: 'true'
          TAO_RUN_MUTATIONS: 'true'
        run: python scripts/run_unittest_report.py --start-dir tests --experiment integration-ci --report-dir test-reports

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: test-reports/

  real-pipeline:
    name: Real TAO GPU pipeline
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pipeline == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
      TAO_RUN_REAL_TESTS: 'true'
      TAO_RUN_REAL_PIPELINE: 'true'
      TAO_RUN_REAL_DEPLOY: 'true'
      TAO_TEST_WORKSPACE_ID: ${{ vars.TAO_TEST_WORKSPACE_ID }}
      TAO_TRAIN_DATASET_URI: ${{ vars.TAO_TRAIN_DATASET_URI }}
      TAO_TRAIN_SPECS_JSON: ${{ secrets.TAO_TRAIN_SPECS_JSON }}
      TAO_EVAL_SPECS_JSON: ${{ secrets.TAO_EVAL_SPECS_JSON }}
      TAO_EXPORT_SPECS_JSON: ${{ secrets.TAO_EXPORT_SPECS_JSON }}
      TAO_TRT_SPECS_JSON: ${{ secrets.TAO_TRT_SPECS_JSON }}
      TAO_INFERENCE_SPECS_JSON: ${{ secrets.TAO_INFERENCE_SPECS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Run real training pipeline
        run: python scripts/run_unittest_report.py --start-dir tests --pattern 'test_real_pipeline_unittest.py' --experiment pipeline-ci --report-dir test-reports

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-report
          path: test-reports/

  full-api-validation:
    name: Complete TAO API validation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_api == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
      TAO_RUN_REAL_TESTS: 'true'
      TAO_RUN_MUTATIONS: 'true'
      TAO_RUN_REAL_PIPELINE: 'true'
      TAO_RUN_REAL_DEPLOY: 'true'
      TAO_TEST_WORKSPACE_ID: ${{ vars.TAO_TEST_WORKSPACE_ID }}
      TAO_TRAIN_DATASET_URI: ${{ vars.TAO_TRAIN_DATASET_URI }}
      TAO_EVAL_DATASET_URI: ${{ vars.TAO_EVAL_DATASET_URI }}
      TAO_INFERENCE_DATASET_URI: ${{ vars.TAO_INFERENCE_DATASET_URI }}
      TAO_REAL_NETWORK: ${{ vars.TAO_REAL_NETWORK || 'classification_pyt' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Generate real specs from TAO API schemas
        run: |
          python scripts/generate_tao_specs.py --output "$RUNNER_TEMP/tao-specs"
          {
            echo "TAO_TRAIN_SPECS_JSON_FILE=$RUNNER_TEMP/tao-specs/train.json"
            echo "TAO_EVAL_SPECS_JSON_FILE=$RUNNER_TEMP/tao-specs/evaluate.json"
            echo "TAO_EXPORT_SPECS_JSON_FILE=$RUNNER_TEMP/tao-specs/export.json"
            echo "TAO_TRT_SPECS_JSON_FILE=$RUNNER_TEMP/tao-specs/gen_trt_engine.json"
            echo "TAO_INFERENCE_SPECS_JSON_FILE=$RUNNER_TEMP/tao-specs/inference.json"
          } >> "$GITHUB_ENV"

      - name: Run complete direct API validation
        shell: bash
        run: |
          set +e
          python scripts/run_unittest_report.py \
            --start-dir tests \
            --pattern 'test_api_unittest.py' \
            --experiment full-api-contract \
            --report-dir test-reports
          api_status=$?
          python scripts/run_unittest_report.py \
            --start-dir tests \
            --pattern 'test_real_pipeline_unittest.py' \
            --experiment full-api-tao-pipeline \
            --report-dir test-reports
          pipeline_status=$?
          if [ "$api_status" -ne 0 ] || [ "$pipeline_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload complete API validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-api-validation-report
          path: test-reports/

  prompt-e2e:
    name: Experiment 001 OpenCode prompt E2E
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_prompt == true }}
    runs-on: [self-hosted, linux, tao-ftms]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_AUTH_MODE: api_key
      OPENCODE_DISABLE_PROJECT_CONFIG: '1'
      NGC_KEY: ${{ secrets.NGC_API_KEY }}
      TAO_TOKEN: ${{ secrets.TAO_TOKEN }}
      TAO_BASE_URL: ${{ vars.TAO_BASE_URL || 'http://host.docker.internal:8090' }}
      TAO_ORG: ${{ vars.TAO_ORG || 'getter' }}
      TAO_TEST_WORKSPACE_ID: ${{ vars.TAO_TEST_WORKSPACE_ID }}
      TAO_TRAIN_DATASET_URI: ${{ vars.TAO_TRAIN_DATASET_URI }}
      TAO_EVAL_DATASET_URI: ${{ vars.TAO_EVAL_DATASET_URI }}
      TAO_INFERENCE_DATASET_URI: ${{ vars.TAO_INFERENCE_DATASET_URI }}
      TAO_BASE_EXPERIMENT_IDS: ${{ vars.TAO_BASE_EXPERIMENT_IDS }}
      TAO_REAL_NETWORK: ${{ vars.TAO_REAL_NETWORK || 'classification_pyt' }}
      TAO_MCP_ALLOW_MUTATIONS: 'true'
      TAO_RUN_REAL_TESTS: 'true'
      TAO_RUN_REAL_PIPELINE: 'true'
      TAO_RUN_REAL_DEPLOY: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MCP environment
        run: |
          python -m venv mcp/.venv
          mcp/.venv/bin/pip install -e 'mcp[test]'

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version

      - name: Create CI OpenCode config
        env:
          OPENCODE_CONFIG_OUTPUT: ${{ runner.temp }}/opencode-ci.json
        run: |
          python scripts/create_opencode_ci_config.py
          echo "OPENCODE_CONFIG=${{ runner.temp }}/opencode-ci.json" >> "$GITHUB_ENV"

      - name: Verify OpenCode MCP connection
        run: opencode mcp list

      - name: Run Experiment 001 prompt
        run: |
          python scripts/run_opencode_prompt_report.py \
            --prompt-file tests/prompts/experiment_001_full_pipeline.txt \
            --experiment 001-prompt-e2e \
            --report-dir test-reports \
            --artifact-dir test-reports/experiment_001-prompt-e2e

      - name: Package prompt report
        if: always()
        run: tar -czf "experiment_001-prompt-${GITHUB_RUN_ID}.tar.gz" -C test-reports experiment_001-prompt-e2e experiment_001-prompt-e2e-opencode.md

      - name: Upload prompt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-prompt-report
          path: |
            test-reports/
            experiment_001-prompt-*.tar.gz

  publish-prompt-release:
    name: Publish Experiment 001 Release
    needs: prompt-e2e
    if: ${{ needs.prompt-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download prompt report
        uses: actions/download-artifact@v4
        with:
          name: experiment-001-prompt-report
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experiment-001-prompt-${{ github.run_number }}
          name: Experiment 001 Prompt ${{ github.run_number }}
          generate_release_notes: false
          body: |
            Real OpenCode -> Azure OpenAI -> TAO MCP -> TAO FTMS experiment.
            The browsable technical report is published at the repository GitHub Pages site.
            Raw OpenCode/MCP events are attached as release assets.
          files: release-assets/experiment_001-prompt-*.tar.gz

  publish-prompt-wiki:
    name: Publish Experiment 001 report to Wiki
    needs: prompt-e2e
    if: ${{ needs.prompt-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prompt report
        uses: actions/download-artifact@v4
        with:
          name: experiment-001-prompt-report
          path: report-input

      - name: Checkout Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki || {
            mkdir wiki
            git -C wiki init
            git -C wiki checkout -b master
            git -C wiki remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          }

      - name: Build Wiki report
        run: |
          python3 scripts/build_wiki_report.py \
            --report-root report-input/test-reports \
            --wiki-root wiki \
            --run-id "${GITHUB_RUN_ID}"

      - name: Publish Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add .
          git -C wiki diff --cached --quiet || git -C wiki commit -m "Add Experiment 001 report ${GITHUB_RUN_ID}"
          git -C wiki push origin HEAD:master
          echo "Wiki report: https://github.com/${GITHUB_REPOSITORY}/wiki/Experiment-001-Prompt-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
