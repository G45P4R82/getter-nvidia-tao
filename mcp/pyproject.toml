[project]
name = "tao-ftms-mcp"
version = "0.1.0"
description = "FastMCP server for NVIDIA TAO FTMS"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.12,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "respx>=0.22,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
